<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #173b70;
        }

        p {
            text-align: center;
            color: #666;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background: #173b70;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .add-btn {
            width: 100%;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #173b70;
            color: white;
        }

        .delete-btn {
            background: #dc3545;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Management System</h1>

    <p>Register and manage student information</p>

    <h3>Add New Student</h3>

    <form id="studentForm">

        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter student name" required>

        <label>Matric Number</label>
        <input type="text" id="matric" placeholder="Enter matric number" required>

        <label>Department</label>
        <input type="text" id="department" placeholder="Enter department" required>

        <label>Level</label>
        <select id="level" required>
            <option value="">Select Level</option>
            <option value="100">100 Level</option>
            <option value="200">200 Level</option>
            <option value="300">300 Level</option>
            <option value="400">400 Level</option>
        </select>

        <button type="submit" class="add-btn">Add Student</button>

    </form>

    <h3>Registered Students</h3>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Matric No.</th>
                <th>Department</th>
                <th>Level</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="studentList"></tbody>
    </table>

</div>

<script>

    let students = JSON.parse(localStorage.getItem("students")) || [];

    const form = document.getElementById("studentForm");

    function displayStudents() {

        const list = document.getElementById("studentList");

        list.innerHTML = "";

        students.forEach((student, index) => {

            let row = document.createElement("tr");

            [student.name, student.matric, student.department, student.level]
                .forEach(value => {
                    let cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

            let actionCell = document.createElement("td");

            let deleteButton = document.createElement("button");

            deleteButton.textContent = "Delete";
            deleteButton.className = "delete-btn";

            deleteButton.onclick = function() {
                students.splice(index, 1);
                saveStudents();
            };

            actionCell.appendChild(deleteButton);
            row.appendChild(actionCell);

            list.appendChild(row);

        });

    }

    function saveStudents() {
        localStorage.setItem("students", JSON.stringify(students));
        displayStudents();
    }

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        const student = {
            name: document.getElementById("name").value,
            matric: document.getElementById("matric").value,
            department: document.getElementById("department").value,
            level: document.getElementById("level").value
        };

        students.push(student);

        saveStudents();

        form.reset();

        alert("Student added successfully!");

    });

    displayStudents();

</script>

</body>
</html>
